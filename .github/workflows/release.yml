name: Release

on:
  workflow_run:
    workflows: ["ci"]
    branches: ["main"]
    types:
      - completed

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: write

    steps:
    - name: Checkout code
      if: github.event.workflow_run.conclusion == 'success'
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: set up python 3.12
      run: uv python install 3.12

    - name: Install the project
      run: uv sync --all-extras

    - name: Bump version
      id: bump-version
      run: uv run semantic-release version
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build package
      run: uv build

    - name: Publish package to GitHub
      if: steps.bump-version.outputs.released == 'true'
      id: publish-version
      run: uv run semantic-release publish
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish package to PyPI
      if: steps.bump-version.outputs.released == 'true'
      run: uv publish
      env:
        UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

    outputs:
      tag: ${{ steps.bump-version.outputs.tag }}
      released: ${{ steps.bump-version.outputs.released }}

  devcontainer:
    if: needs.release.outputs.released == 'true'
    needs: release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log into registry ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push devcontainer image
      uses: devcontainers/ci@v0.3
      with:
        imageName: ghcr.io/davidban77/labcli
        imageTag: ${{ needs.release.outputs.tag }}
        push: always
