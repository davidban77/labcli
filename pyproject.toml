[project]
name = "labcli"
version = "0.2.0"
description = "A CLI wrapper for common commands to setup lab environments"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.15.1",
    "python-dotenv>=1.0.1",
    "pulumi>=3.152.0",
    "pulumi_digitalocean>=4.40.0",
]
license = { text = "MIT" }

[project.urls]
homepage = "https://github.com/davidban77/labcli"
repository = "https://github.com/davidban77/labcli"

[project.scripts]
labcli = "labcli.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "isort",
    "ipython",
    "python-semantic-release"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "B", "I"]

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["labcli"]

[tool.semantic_release]
allow_zero_version = true
assets = []
build_command_env = []
commit_message = "chore(release):Bump v{new_version} [skip ci]"
commit_parser = "angular"
logging_use_named_masks = false
major_on_zero = true
no_git_verify = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false
prerelease_token = "rc"

[tool.semantic_release.changelog]
exclude_commit_patterns = []
insertion_flag = "<!-- version list -->"
mode = "init"
template_dir = "templates"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
mask_initial_release = false
output_format = "md"

[tool.semantic_release.changelog.environment]
autoescape = false
block_end_string = "%}"
black_start_string = "{%"
comment_end_string = "#}"
comment_start_string = "{#"
extensions = []
keep_trailing_newline = false
lstrip_blocks = false
newline_sequence = "\n"
trim_blocks = false
variable_end_string = "}}"
variable_start_string = "{{"

[tool.semantic_release.commit_author]
default = "semantic-release <semantic-release>"
env = "GIT_COMMIT_AUTHOR"

[tool.semantic_release.commit_parser_options]
allow_tags = [
    "chore",
    "docs",
    "feat",
    "fix",
    "perf",
    "refactor",
    "revert",
    "style",
    "test",
]
default_bump_level = 0
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor", "style", "test"]

[tool.semantic_release.remote]
ignore_token_for_push = true
insecure = false
name = "origin"
type = "github"

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true
